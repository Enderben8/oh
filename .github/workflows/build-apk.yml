name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer and deps
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config
          sudo apt-get install -y libffi-dev libssl-dev
          sudo apt-get install -y zipalign adb

      - name: Build with buildozer
        working-directory: mobile
        run: |
          buildozer -v android debug 2>&1 | tee buildozer_fail.log
          echo "BUILDOZER_EXIT=${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}
        env:
          JDK_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload buildozer log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-fail-log
          path: mobile/buildozer_fail.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: revisiontracker-apk
          path: mobile/bin/*.apk