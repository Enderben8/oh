name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/**", "revision_core.py"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer and deps
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi setuptools cython==0.29.34
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin libltdl-dev pkg-config ninja-build
          sudo apt-get install -y libffi-dev libssl-dev zlib1g-dev libncurses-dev
          sudo apt-get install -y zipalign adb

      - name: Build with buildozer
        working-directory: mobile
        run: buildozer android debug
        env:
          JDK_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: revisiontracker-apk
          path: mobile/bin/*.apk